# /etc/nginx/sites-available/restuindia.in
# Symlink: ln -s /etc/nginx/sites-available/restuindia.in /etc/nginx/sites-enabled/

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name restuindia.in www.restuindia.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restuindia.in www.restuindia.in;

    # ── SSL (managed by Certbot) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/restuindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restuindia.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Hide Nginx version
    server_tokens off;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/restuindia.access.log;
    error_log  /var/log/nginx/restuindia.error.log warn;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── Client body size (for image uploads) ─────────────────────────────────
    client_max_body_size 10M;

    # ── API proxy → Node.js backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Uploaded media files ──────────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/restu-india-backend/src/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Deny PHP/script execution inside uploads
        location ~ \.(php|py|js|sh)$ {
            deny all;
        }
    }

    # ── React SPA (built dist) ────────────────────────────────────────────────
    root /var/www/restu-india-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block dotfiles (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }
}
