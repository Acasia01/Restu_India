version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: restu_mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    expose:
      - 27017

  backend:
    build:
      context: ./restu-india-backend
      dockerfile: Dockerfile
    container_name: restu_backend
    restart: always
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/restu_india
      - JWT_SECRET=change_this_to_a_random_string_in_production
      - ALLOWED_ORIGINS=http://localhost:5173,https://yourdomain.com
    volumes:
      - uploads_data:/usr/src/app/src/uploads
    expose:
      - 5000

  frontend:
    build:
      context: ./restu-india
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.yourdomain.com/api
    container_name: restu_frontend
    restart: always
    depends_on:
      - backend
    expose:
      - 80

volumes:
  mongodb_data:
  uploads_data:
